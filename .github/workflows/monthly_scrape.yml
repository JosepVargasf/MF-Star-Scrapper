name: Monthly Scrape

on:
  schedule:
    - cron: "0 6 1 * *"   # Día 1 de cada mes a las 06:00 UTC
  workflow_dispatch:       # Permite ejecución manual desde GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run pipeline
        run: python pipeline.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/reviews.json visor/public/data/reviews.json
          cp data/metrics.json visor/public/data/metrics.json
          git add -f data/reviews.json data/metrics.json data/informe_multifamily.xlsx
          git add visor/public/data/reviews.json visor/public/data/metrics.json
          git diff --staged --quiet || git commit -m "data: actualización mensual $(date +'%Y-%m')"
          git push

      - name: Trigger deploy visor
        if: success()
        run: gh workflow run deploy_visor.yml --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[MF Star Scrapper] Pipeline mensual ejecutado con éxito"
          to: jose.vargas@situ.cl
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            El pipeline mensual de MF Star Scrapper se ejecutó correctamente.

            Revisa los datos actualizados en el visor:
              https://josepvargasf.github.io/MF-Star-Scrapper/

            Repositorio: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[MF Star Scrapper] Fallo en el workflow mensual"
          to: jose.vargas@situ.cl
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            El workflow mensual de MF Star Scrapper falló.

            Repositorio: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Por favor revisa el log y ejecuta el pipeline manualmente si es necesario:
              python pipeline.py
